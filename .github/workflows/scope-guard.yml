name: Scope Guard

# Markiert Pull Requests, die gemeinsam genutzte Dateien anfassen. Solche
# PRs koennen andere parallele Batches brechen und brauchen mehr Sorgfalt
# (siehe docs/BATCH-WORKFLOW.md, Abschnitt "Shared Core").

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo
            const number = context.payload.pull_request.number

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner, repo, pull_number: number, per_page: 100,
            })
            const paths = files.map((file) => file.filename)

            const sharedPrefixes = [
              'src/core/', 'src/ui/', 'src/app/',
              'package.json', 'package-lock.json',
              'vite.config.ts', 'tsconfig', 'eslint.config.js',
              '.github/workflows/',
            ]
            const touchesShared = paths.some((path) =>
              sharedPrefixes.some((prefix) => path.startsWith(prefix)))

            const featureDirs = [...new Set(paths
              .filter((path) => path.startsWith('src/features/'))
              .map((path) => path.split('/')[2]))]

            const labels = []
            if (touchesShared) labels.push('shared-core')
            featureDirs.forEach((dir) => labels.push(`feature:${dir}`))
            if (labels.length === 0) return

            for (const name of labels) {
              try {
                await github.rest.issues.getLabel({ owner, repo, name })
              } catch {
                await github.rest.issues.createLabel({
                  owner, repo, name,
                  color: name === 'shared-core' ? 'd93f0b' : '0e8a16',
                  description: name === 'shared-core'
                    ? 'Beruehrt gemeinsam genutzten Code - kann parallele Batches brechen'
                    : 'Betrifft ein einzelnes Feature-Modul',
                })
              }
            }
            await github.rest.issues.addLabels({ owner, repo, issue_number: number, labels })
