name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Merge Queue: erlaubt mehreren fertigen Batches, nacheinander sicher
  # nach main zu gehen, ohne sich gegenseitig rot zu machen.
  merge_group:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, Typecheck, Tests, Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Preview-Build als Artefakt (nur bei Pull Requests)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: preview-pr-${{ github.event.number }}
          path: dist
          retention-days: 7
